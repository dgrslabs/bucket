name: secret-scan

# Server-side backstop for the pre-commit gitleaks hook: even if someone commits
# without hooks installed, this fails the push/PR when a secret is detected.
#
# This runs the gitleaks CLI directly (MIT-licensed, free everywhere) rather than
# gitleaks/gitleaks-action, which requires a paid GITLEAKS_LICENSE on GitHub
# organization accounts such as dgrslabs.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with the gitleaks rev in .pre-commit-config.yaml.
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run gitleaks
        # Scans the full git history using .gitleaks.toml; exits non-zero on a leak.
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
